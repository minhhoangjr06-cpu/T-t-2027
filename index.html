<!doctype html>
<html lang="vi">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đếm Ngược Tết Nguyên Đán</title>

      tailwind.config = {
        theme: {
          extend: {
            colors: {

    <style>
      /* Custom scrollbar and backdrop effects */
      body {
        background: linear-gradient(
          135deg,
          #4a000b 0%,
          #a60c1e 50%,
          #5e0008 100%
        );
        min-height: 100vh;
        color: #fff8dc;
        overflow-x: hidden;
        user-select: none;
      }

      /* Glassmorphism Card */
      .glass-card {
        background: rgba(139, 0, 0, 0.45);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 215, 0, 0.3);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.6),
          inset 0 0 15px rgba(255, 215, 0, 0.15);
      }

      /* Golden Text Gradient */
      .gold-gradient-text {
        background: linear-gradient(
          180deg,
          #fff5c0 0%,
          #ffd700 45%,
          #daa520 80%,
          #996515 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      }

      /* Petal animation styling */
      .petal {
        position: absolute;
        pointer-events: none;
        z-index: 10;
        top: -20px;
        animation: fall linear infinite;
      }

      @keyframes fall {
        0% {
          transform: translateY(-20px) rotate(0deg) translateX(0);
          opacity: 0.9;
        }
        50% {
          transform: translateY(50vh) rotate(180deg) translateX(40px);
        }
        100% {
          transform: translateY(105vh) rotate(360deg) translateX(-20px);
          opacity: 0.2;
        }
      }

      /* Pulse glowing effect for numbers */
      .glow-box {
        box-shadow:
          0 0 20px rgba(255, 215, 0, 0.2),
          inset 0 0 10px rgba(255, 215, 0, 0.1);
      }

      /* Lantern Swing Animation */
      @keyframes swing {
        0%,
        100% {
          transform: rotate(-5deg);
        }
        50% {
          transform: rotate(5deg);
        }
      }
      .swinging-lantern {
        transform-origin: top center;
        animation: swing 4s ease-in-out infinite;
      }
    </style>

    <!-- Web Audio Synthesizer sound generator for festive background melody -->
    <script>
      // --- Web Audio Synthesizer (No external MP3 file dependency needed) ---
      class FestiveAudioPlayer {
        constructor() {
          this.ctx = null;
          this.isPlaying = false;
          this.timer = null;
          // Traditional pentatonic scale notes (C, D, E, G, A) in Vietnamese music style
          this.notes = [
            261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25,
          ];
          this.melody = [
            0, 2, 4, 3, 4, 5, 4, 3, 2, 0, 2, 4, 3, 2, 0, -1, 4, 5, 7, 5, 4, 3,
            2, 4, 3, 2, 0, 2, 0, -1, 0, 0,
          ];
          this.noteIndex = 0;
        }

        init() {
          if (!this.ctx) {
            const AudioContext =
              window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
          }
        }

        playNote(freq, duration = 0.4) {
          if (!this.ctx || freq <= 0) return;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          // Soft bell-like synth tone (marimba / traditional instrument style)
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.ctx.currentTime + duration,
          );

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        }

        toggle() {
          this.init();
          if (this.ctx.state === "suspended") {
            this.ctx.resume();
          }

          if (this.isPlaying) {
            this.stop();
            return false;
          } else {
            this.start();
            return true;
          }
        }

        start() {
          this.isPlaying = true;
          this.noteIndex = 0;
          this.timer = setInterval(() => {
            const noteIdx = this.melody[this.noteIndex];
            if (noteIdx >= 0 && noteIdx < this.notes.length) {
              this.playNote(this.notes[noteIdx], 0.45);
            }
            this.noteIndex = (this.noteIndex + 1) % this.melody.length;
          }, 300);
        }

        stop() {
          this.isPlaying = false;
          if (this.timer) {
            clearInterval(this.timer);
            this.timer = null;
          }
        }
      }

      const audioPlayer = new FestiveAudioPlayer();
    </script>

    <!-- App Logic Script -->
    <script>
      // --- State & Constants ---
      const DEFAULT_TARGET = "2027-02-06T00:00:00";
      const DEFAULT_TITLE = "Tết Nguyên Đán 2027";

      let targetDate = new Date(
        localStorage.getItem("tet_target_date") || DEFAULT_TARGET,
      );
      let targetTitle =
        localStorage.getItem("tet_target_title") || DEFAULT_TITLE;
      let petalMode = localStorage.getItem("tet_petal_mode") || "both"; // 'mai', 'dao', 'both'

      const quotes = [
        '"Vạn sự như ý - An khang thịnh vượng - Tấn tài tấn lộc"',
        '"Chúc mừng năm mới - Giáp Thìn hanh thông - Bình an hạnh phúc"',
        '"Mừng xuân sang - Phúc lộc thọ tràn đầy - Gia đạo êm ấm"',
        '"Năm mới thắng lợi mới - Mã đáo thành công - Sức khỏe dồi dào"',
        '"Đón lộc đầu xuân - May mắn quanh năm - Phát tài phát lộc"',
      ];

      // --- DOM Elements ---
      const daysEl = document.getElementById("days");
      const hoursEl = document.getElementById("hours");
      const minutesEl = document.getElementById("minutes");
      const secondsEl = document.getElementById("seconds");
      const millisecondsEl = document.getElementById("milliseconds");
      const yearTitleEl = document.getElementById("year-title");
      const targetDateDisplayEl = document.getElementById(
        "target-date-display",
      );
      const festiveQuoteEl = document.getElementById("festive-quote");
      const petalContainer = document.getElementById("petal-container");

      // Modal Elements
      const modal = document.getElementById("settings-modal");
      const btnSettings = document.getElementById("btn-settings");
      const btnCloseModal = document.getElementById("btn-close-modal");
      const btnSaveSettings = document.getElementById("btn-save-settings");
      const presetSelect = document.getElementById("preset-date-select");
      const customDateContainer = document.getElementById(
        "custom-date-container",
      );
      const customDateInput = document.getElementById("custom-date-input");
      const customTitleInput = document.getElementById("custom-title-input");

      // Buttons
      const btnMusic = document.getElementById("btn-music");
      const musicIcon = document.getElementById("music-icon");
      const btnPetal = document.getElementById("btn-petal");
      const petalText = document.getElementById("petal-text");
      const btnFireworks = document.getElementById("btn-fireworks");
      const btnFullscreen = document.getElementById("btn-fullscreen");

      // --- Core Countdown Function ---
      function updateCountdown() {
        const now = new Date();
        const diff = targetDate.getTime() - now.getTime();

        if (diff <= 0) {
          // Happy New Year Reached!
          daysEl.innerText = "00";
          hoursEl.innerText = "00";
          minutesEl.innerText = "00";
          secondsEl.innerText = "00";
          millisecondsEl.innerText = "000";
          festiveQuoteEl.innerText = "🎉 CHÚC MỪNG NĂM MỚI! TẾT ĐẾN RỒI! 🎉";
          triggerFireworks();
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
          (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
        );
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        const milliseconds = Math.floor(diff % 1000);

        daysEl.innerText = String(days).padStart(2, "0");
        hoursEl.innerText = String(hours).padStart(2, "0");
        minutesEl.innerText = String(minutes).padStart(2, "0");
        secondsEl.innerText = String(seconds).padStart(2, "0");
        millisecondsEl.innerText = String(milliseconds).padStart(3, "0");
      }

      // --- Falling Blossom Petals Logic ---
      function createPetal() {
        if (document.hidden) return; // Save memory if tab inactive

        const petal = document.createElement("div");
        petal.className = "petal";

        // Select SVG/Icon for Cherry Blossom (Đào) or Apricot Blossom (Mai)
        const isMai =
          petalMode === "mai" || (petalMode === "both" && Math.random() > 0.5);

        // Apricot = Yellow, Cherry = Pink
        const color = isMai ? "#FFD700" : "#FFB7C5";
        const size = Math.random() * 14 + 10; // 10px to 24px

        petal.innerHTML = `
                <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" opacity="0.85">
                    <path d="M12,2 C13.5,6 17.5,7.5 19.5,10 C21.5,12.5 20.5,16.5 18,18.5 C15.5,20.5 12,19.5 12,22 C12,19.5 8.5,20.5 6,18.5 C3.5,16.5 2.5,12.5 4.5,10 C6.5,7.5 10.5,6 12,2 Z" />
                </svg>
            `;

        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = Math.random() * 5 + 6 + "s"; // 6s - 11s
        petal.style.animationDelay = "0s";

        petalContainer.appendChild(petal);

        setTimeout(() => {
          petal.remove();
        }, 11000);
      }

      function initPetals() {
        petalContainer.innerHTML = "";
        // Generate initial batch
        for (let i = 0; i < 25; i++) {
          setTimeout(createPetal, Math.random() * 3000);
        }
        // Continuous generation interval
        setInterval(createPetal, 400);
      }

      // --- Fireworks Animation (Confetti library) ---
      function triggerFireworks() {
        if (typeof confetti === "function") {
          const count = 200;
          const defaults = { origin: { y: 0.7 } };

          function fire(particleRatio, opts) {
            confetti(
              Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio),
              }),
            );
          }

          fire(0.25, {
            spread: 26,
            startVelocity: 55,
            colors: ["#FFD700", "#FF0000"],
          });
          fire(0.2, { spread: 60, colors: ["#FFFFFF", "#FFD700"] });
          fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
          fire(0.1, {
            spread: 120,
            startVelocity: 25,
            decay: 0.92,
            colors: ["#FFD700", "#E60000", "#FFA500"],
          });
          fire(0.1, { spread: 120, startVelocity: 45 });
        }
      }

      // --- UI Updates ---
      function applyDisplayData() {
        yearTitleEl.innerText = targetTitle;
        const dateStr = targetDate.toLocaleDateString("vi-VN", {
          weekday: "long",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        });
        targetDateDisplayEl.innerHTML = `Mùng 1 Tết: <span class="text-white font-bold">${dateStr}</span>`;
      }

      // Rotate quotes periodically
      let quoteIndex = 0;
      setInterval(() => {
        quoteIndex = (quoteIndex + 1) % quotes.length;
        festiveQuoteEl.innerText = quotes[quoteIndex];
      }, 8000);

      // --- Event Listeners ---

      // Toggle Audio
      btnMusic.addEventListener("click", () => {
        const isPlaying = audioPlayer.toggle();
        if (isPlaying) {
          btnMusic.classList.add("bg-amber-600");
          musicIcon.className = "fa-solid fa-volume-high animate-pulse";
        } else {
          btnMusic.classList.remove("bg-amber-600");
          musicIcon.className = "fa-solid fa-music";
        }
      });

      // Toggle Petal Mode (Mai -> Đào -> Cả hai)
      btnPetal.addEventListener("click", () => {
        if (petalMode === "both") {
          petalMode = "mai";
          petalText.innerText = "Hoa Mai (Vàng)";
        } else if (petalMode === "mai") {
          petalMode = "dao";
          petalText.innerText = "Hoa Đào (Hồng)";
        } else {
          petalMode = "both";
          petalText.innerText = "Hoa Mai & Đào";
        }
        localStorage.setItem("tet_petal_mode", petalMode);
      });

      // Fireworks Button
      btnFireworks.addEventListener("click", () => {
        triggerFireworks();
      });

      // Fullscreen Toggle
      btnFullscreen.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });

      // Settings Modal Handlers
      btnSettings.addEventListener("click", () => {
        customTitleInput.value = targetTitle;
        modal.classList.remove("hidden");
      });

      btnCloseModal.addEventListener("click", () => {
        modal.classList.add("hidden");
      });

      presetSelect.addEventListener("change", (e) => {
        if (e.target.value === "custom") {
          customDateContainer.classList.remove("hidden");
        } else {
          customDateContainer.classList.add("hidden");
        }
      });

      btnSaveSettings.addEventListener("click", () => {
        const presetVal = presetSelect.value;
        let newDateStr = presetVal;

        if (presetVal === "custom") {
          newDateStr = customDateInput.value;
        }

        if (newDateStr) {
          targetDate = new Date(newDateStr);
          localStorage.setItem("tet_target_date", targetDate.toISOString());
        }

        if (customTitleInput.value.trim() !== "") {
          targetTitle = customTitleInput.value.trim();
          localStorage.setItem("tet_target_title", targetTitle);
        }

        applyDisplayData();
        modal.classList.add("hidden");
      });

      // --- Initialization ---
      window.onload = function () {
        applyDisplayData();
        initPetals();

        // High precision smooth interval (around ~30fps for smooth ms counter)
        setInterval(updateCountdown, 33);
      };
    </script>
  </body>
</html>
